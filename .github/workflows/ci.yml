name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  template-smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        package: [cask]
        include:
          - os: ubuntu-latest
            package: formula
          - os: ubuntu-latest
            package: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.23'
          enable-cache: false
      - name: Read release version
        id: release-version
        shell: bash
        run: echo "version=$(cat '{{cookiecutter.project_slug}}/.goreleaser-version')" >> "$GITHUB_OUTPUT"
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: ${{ steps.release-version.outputs.version }}
          install-only: true
      - name: Render and check
        env:
          PACKAGE_TYPE: ${{ matrix.package }}
        shell: bash
        run: uv run --no-project --with cookiecutter==2.7.1 python scripts/check.py --package "$PACKAGE_TYPE"

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - name: Audit template workflows
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          pipx run zizmor==1.30.1 --no-progress .github/workflows
