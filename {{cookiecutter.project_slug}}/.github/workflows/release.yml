name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: {% raw %}release-${{ github.ref }}{% endraw %}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
  release:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Read release version
        id: release-version
        run: echo "version=$(cat .goreleaser-version)" >> "$GITHUB_OUTPUT"
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: {% raw %}${{ steps.release-version.outputs.version }}{% endraw %}
          args: release --clean
        env:
          GITHUB_TOKEN: {% raw %}${{ secrets.GITHUB_TOKEN }}{% endraw %}
{% if cookiecutter.homebrew_package_type != "none" %}          HOMEBREW_TAP_TOKEN: {% raw %}${{ secrets.HOMEBREW_TAP_TOKEN }}{% endraw %}
{% endif %}
